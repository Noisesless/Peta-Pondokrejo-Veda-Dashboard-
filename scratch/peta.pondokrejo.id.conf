server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/peta.pondokrejo.id.key;
  ssl_certificate /etc/nginx/ssl-certificates/peta.pondokrejo.id.crt;
  server_name peta.pondokrejo.id;
  root /home/pondokrejo-peta/htdocs/peta.pondokrejo.id;

  access_log /home/pondokrejo-peta/logs/nginx/access.log main;
  error_log /home/pondokrejo-peta/logs/nginx/error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  include /etc/nginx/global_settings;

  # Security Hardening: HSTS
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  index index.html;

  # ==============================================================================
  # BLOKIR AKSES BERKAS SENSITIF (.env, .htaccess, .git, scripts, backups)
  # ==============================================================================
  # 1. Blokir semua dotfiles kecuali .well-known
  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  # 2. Blokir berkas rahasia, environment, script shell, log, dan backup
  location ~* (\.env.*|\.git.*|\.htaccess.*|\.sql$|\.bak$|\.log$|\.sh$|\.bat$|composer\.(json|lock)|package(-lock)?\.json|\.md$) {
    deny all;
    return 404;
  }

  location ~* ^/desa/upload/.*\.php$ {
    deny all;
    return 404;
  }

  # Rate limiting HANYA untuk percobaan login (Anti brute-force password)
  location = /api/login {
    limit_req zone=pdrj_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:5092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy Utama Berkecepatan Tinggi (Bebas throttle untuk kenyamanan pengguna)
  location / {
    proxy_pass http://127.0.0.1:5092/;
    proxy_pass_header Referer;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass_request_headers on;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }
}
